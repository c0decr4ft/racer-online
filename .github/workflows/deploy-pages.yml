name: Deploy GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - uses: mymindstorm/setup-emsdk@v14
        with:
          version: latest
          actions-cache-folder: emsdk-cache
      - name: Build and verify C++ physics
        run: npm run wasm:build && npm run wasm:verify
      # Point the static Pages build at a cloud game server (set repo Actions secrets):
      #   VITE_API_BASE = https://YOUR-APP.onrender.com/api
      #   VITE_WS_URL   = wss://YOUR-APP.onrender.com
      # Also writes public/online.json so runtime fetch works for older caches.
      - name: Write online endpoints
        env:
          VITE_API_BASE: ${{ secrets.VITE_API_BASE }}
          VITE_WS_URL: ${{ secrets.VITE_WS_URL }}
        run: |
          node -e '
            const fs = require("fs");
            const DEFAULT_API = "https://racer-online.onrender.com/api";
            const DEFAULT_WS = "wss://racer-online.onrender.com";
            const body = {
              apiBase: (process.env.VITE_API_BASE || "").trim() || DEFAULT_API,
              wsUrl: (process.env.VITE_WS_URL || "").trim() || DEFAULT_WS,
            };
            fs.writeFileSync("public/online.json", JSON.stringify(body, null, 2) + "\n");
            console.log("online.json →", body);
          '
      - name: Build
        env:
          VITE_API_BASE: ${{ secrets.VITE_API_BASE || 'https://racer-online.onrender.com/api' }}
          VITE_WS_URL: ${{ secrets.VITE_WS_URL || 'wss://racer-online.onrender.com' }}
        run: npm run build
      - name: Add .nojekyll
        run: touch dist/.nojekyll
      # Keep /racer-online/vX.Y/ snapshots playable across orphan deploys of latest.
      - name: Preserve versioned snapshots
        run: |
          if git ls-remote --exit-code --heads origin gh-pages >/dev/null 2>&1; then
            git fetch origin gh-pages:gh-pages-prev
            mkdir -p /tmp/gh-pages-prev
            git archive gh-pages-prev | tar -x -C /tmp/gh-pages-prev
            for d in /tmp/gh-pages-prev/v*/; do
              [ -d "$d" ] || continue
              name=$(basename "$d")
              rm -rf "dist/$name"
              cp -a "$d" "dist/$name"
              echo "Preserved $name"
            done
          else
            echo "No gh-pages branch yet — skip snapshot preserve"
          fi
      # Publish newly built snapshots from the repo (overrides preserved copies).
      - name: Include dist-versions snapshots
        run: |
          if [ -d dist-versions ]; then
            for d in dist-versions/v*/; do
              [ -d "$d" ] || continue
              name=$(basename "$d")
              rm -rf "dist/$name"
              cp -a "$d" "dist/$name"
              echo "Included $name from dist-versions"
            done
          else
            echo "No dist-versions/ — relying on preserved gh-pages snapshots only"
          fi
      - name: Deploy to gh-pages
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./dist
          force_orphan: true
