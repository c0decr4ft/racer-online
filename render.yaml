# One-click always-on host: https://dashboard.render.com/select-repo?type=blueprint
# Free web service sleeps after ~15m idle — first multiplayer join may take ~30s to wake.
services:
  - type: web
    name: racer-online
    runtime: node
    plan: free
    region: oregon
    buildCommand: npm ci && npm run build
    startCommand: npm start
    healthCheckPath: /healthz
    envVars:
      - key: NODE_ENV
        value: production
      - key: HOST
        value: 0.0.0.0
      - key: PORT
        value: 10000
      # Event Mode pot wallet: real sats via the public Cashu mint (any mint URL works).
      # Unset = mock mode (fake sats) for dev/tests.
      - key: CASHU_MINT_URL
        value: https://mint.minibits.cash
