# One-click always-on host: https://dashboard.render.com/select-repo?type=blueprint
# Free web service sleeps after ~15m idle — first multiplayer join may take ~30s to wake.
services:
  - type: web
    name: racer-online
    runtime: node
    plan: free
    # Frankfurt — players are mostly in Europe; Oregon added ~160ms RTT (jumpy remotes).
    region: frankfurt
    # DEPLOY.md + existing dashboard: production deploys from main (not feature branches).
    branch: main
    # --include=dev: NODE_ENV=production is set on the service, which would make
    # npm ci skip devDependencies — but tsc + vite are needed to build.
    buildCommand: npm ci --include=dev && npm run build
    startCommand: npm start
    healthCheckPath: /healthz
    envVars:
      - key: NODE_ENV
        value: production
      - key: HOST
        value: 0.0.0.0
      - key: PORT
        value: 10000
      # Event Mode: real sat Cashu mint (Lightning → sats). Tips auto-collect
      # into a separate server wallet. Testnut is fake sats — do not use live.
      - key: CASHU_MINT_URL
        value: https://mint.cubabitcoin.org
      # Dev dashboard (/api/dev/*) — only this Nostr account (DEV_c0decr4ft,
      # npub1nratkqj…aud4) may read tip stats/claim tip tokens. Public key, safe
      # to commit; the in-game DEV button appears only when signed in with it.
      - key: DEV_PUBKEY
        value: 98fabb025fc826ca032733ddd18a08f323061ea9c2ff8f9af41c50a07e3d905b
      # Feedback → email inbox. Set this in the Render dashboard (free API key
      # from resend.com). Without it, feedback falls back to the flaky
      # FormSubmit relay (needs one-time email activation).
      - key: RESEND_API_KEY
        sync: false
